<style>

:root{
  --bg:#02040a;
  --white:#f5f7fb;
  --muted:#aeb9ca;
  --accent:#b9d7ff;

  --glass-bg:rgba(12,20,34,.58);
  --glass-border:rgba(200,220,245,.16);
  --glow:rgba(143,190,255,.35);

  --gap:16px;
  --bh:64px;
  --br:16px;
  --area:1180px;
}

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  margin:0;
  overflow-x:hidden;

  color:var(--muted);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      ellipse at 50% 35%,
      rgba(35,68,112,.25),
      transparent 36rem
    ),
    radial-gradient(
      ellipse at 50% 100%,
      rgba(19,43,75,.2),
      transparent 45rem
    ),
    var(--bg);

  transition:
    background 1.5s ease,
    color 1.5s ease;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

button,
a{
  font:inherit;
}

a{
  text-decoration:none;
}


/* =========================================================
   BACKGROUND
   ========================================================= */

.background{
  position:fixed;
  inset:0;
  z-index:-10;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse 32% 27% at 50% 43%,
      rgba(120,168,222,.16),
      transparent 72%
    ),
    #02040a;
}

.background::before{
  content:"";

  position:absolute;
  inset:-12%;

  opacity:.3;

  background-image:
    radial-gradient(
      circle,
      rgba(224,238,255,.9) 0 2px,
      transparent 2.8px
    );

  background-size:18px 18px;

  transform:
    perspective(850px)
    rotateX(10deg)
    scale(1.14,1.08);

  transform-origin:center 43%;

  mask-image:
    radial-gradient(
      ellipse 65% 57% at 50% 43%,
      black 0%,
      rgba(0,0,0,.92) 47%,
      transparent 100%
    );

  animation:dotDrift 18s ease-in-out infinite alternate;
}

.background::after{
  content:"";

  position:absolute;
  inset:-20%;

  background:
    radial-gradient(
      ellipse 27% 21% at 50% 42%,
      rgba(190,220,255,.19),
      transparent 68%
    ),
    radial-gradient(
      ellipse 59% 48% at 50% 42%,
      transparent 36%,
      rgba(0,0,0,.2) 66%,
      rgba(0,0,0,.85) 100%
    );

  animation:bgPulse 10s ease-in-out infinite alternate;
}

.ambient{
  position:fixed;
  inset:0;
  z-index:-8;
  pointer-events:none;

  opacity:.55;

  background:
    radial-gradient(
      circle at 18% 24%,
      rgba(91,139,209,.09),
      transparent 18rem
    ),
    radial-gradient(
      circle at 83% 72%,
      rgba(111,163,233,.08),
      transparent 22rem
    );

  animation:ambMove 16s ease-in-out infinite alternate;
}

@keyframes dotDrift{
  from{
    transform:
      perspective(850px)
      rotateX(10deg)
      scale(1.14,1.08)
      translate3d(0,0,0);
  }

  to{
    transform:
      perspective(850px)
      rotateX(10deg)
      scale(1.14,1.08)
      translate3d(-10px,7px,0);
  }
}

@keyframes bgPulse{
  from{
    opacity:.82;
    transform:
      perspective(850px)
      rotateX(8deg)
      scaleY(1.08);
  }

  to{
    opacity:1;
    transform:
      perspective(850px)
      rotateX(8deg)
      scaleY(1.13);
  }
}

@keyframes ambMove{
  from{
    transform:scale(1) translate3d(0,0,0);
  }

  to{
    transform:scale(1.08) translate3d(1%,-1%,0);
  }
}


/* =========================================================
   PARTICLES
   ========================================================= */

.particles{
  position:fixed;
  inset:0;
  z-index:-5;
  overflow:hidden;
  pointer-events:none;
}

.particles span{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:rgba(205,228,255,.72);

  box-shadow:
    0 0 12px rgba(164,207,255,.8);

  animation:floatP linear infinite;
}

.particles span:nth-child(1){
  left:7%;
  top:22%;
  animation-duration:13s;
  animation-delay:-4s;
}

.particles span:nth-child(2){
  left:18%;
  top:74%;
  animation-duration:17s;
  animation-delay:-8s;
}

.particles span:nth-child(3){
  left:31%;
  top:15%;
  animation-duration:21s;
  animation-delay:-12s;
}

.particles span:nth-child(4){
  left:47%;
  top:82%;
  animation-duration:15s;
  animation-delay:-3s;
}

.particles span:nth-child(5){
  left:62%;
  top:19%;
  animation-duration:19s;
  animation-delay:-9s;
}

.particles span:nth-child(6){
  left:76%;
  top:64%;
  animation-duration:14s;
  animation-delay:-7s;
}

.particles span:nth-child(7){
  left:91%;
  top:30%;
  animation-duration:18s;
  animation-delay:-11s;
}

.particles span:nth-child(8){
  left:84%;
  top:88%;
  animation-duration:23s;
  animation-delay:-16s;
}

@keyframes floatP{

  0%,100%{
    opacity:0;
    transform:
      translate3d(0,30px,0)
      scale(.5);
  }

  20%{
    opacity:.9;
  }

  50%{
    opacity:.45;
    transform:
      translate3d(35px,-90px,0)
      scale(1.2);
  }

  80%{
    opacity:.7;
  }
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
  width:min(calc(100% - 32px),1280px);

  min-height:100vh;

  margin:0 auto;

  padding:84px 0 100px;

  transition:
    transform 1s ease,
    opacity 1s ease,
    filter 1s ease;
}


/* =========================================================
   HERO
   ========================================================= */

.hero{
  position:relative;
  z-index:2;

  margin-bottom:54px;

  text-align:center;
}

.title-stage{
  position:relative;

  display:inline-block;

  padding:30px 80px 50px;

  min-width:420px;
}


/* =========================================================
   TITLE
   ========================================================= */

.title-button{
  position:relative;

  display:inline-flex;

  margin:0;
  padding:0;

  border:0;

  color:var(--white);

  background:transparent;

  cursor:pointer;

  font-size:clamp(3rem,8vw,7.4rem);
  font-weight:850;

  letter-spacing:-.075em;
  line-height:.9;

  text-shadow:
    0 0 12px rgba(255,255,255,.18),
    0 0 42px rgba(147,194,255,.2),
    0 22px 60px rgba(0,0,0,.72);

  transition:
    transform 260ms ease,
    filter 260ms ease,
    opacity 800ms ease,
    text-shadow 260ms ease;
}

.title-button:hover{
  filter:brightness(1.12);

  transform:
    translateY(-5px)
    scale(1.015);

  text-shadow:
    0 0 16px rgba(255,255,255,.35),
    0 0 58px rgba(155,208,255,.5),
    0 22px 60px rgba(0,0,0,.72);
}

.title-button::before{
  content:"";

  position:absolute;

  inset:-18px -28px;

  z-index:-1;

  border-radius:50%;

  opacity:0;

  background:
    radial-gradient(
      ellipse,
      rgba(179,216,255,.28),
      transparent 68%
    );

  filter:blur(16px);

  transform:scale(.75);

  transition:
    opacity 260ms ease,
    transform 260ms ease;
}

.title-button:hover::before{
  opacity:1;
  transform:scale(1);
}

.title-button::after{
  content:"";

  position:absolute;

  left:8%;
  right:8%;

  bottom:-17px;

  height:2px;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(221,237,255,.95),
      transparent
    );

  box-shadow:
    0 0 12px rgba(188,220,255,.85),
    0 0 34px rgba(125,179,255,.5);
}


/* individual title letters */

.title-letter{
  display:inline-block;

  transition:
    opacity .5s ease,
    filter .5s ease,
    transform .5s ease;
}

.title-letter.dead{
  opacity:.23;

  filter:
    grayscale(1)
    brightness(.45);

  text-shadow:none;
}

.title-letter.broken{
  animation:
    letterBreak 900ms ease forwards;
}

@keyframes letterBreak{

  0%{
    transform:translate(0,0) rotate(0);
  }

  25%{
    transform:translate(-2px,3px) rotate(-3deg);
  }

  55%{
    transform:translate(3px,-2px) rotate(2deg);
  }

  100%{
    transform:translate(0,0) rotate(0);
  }
}


/* =========================================================
   CRACKS
   ========================================================= */

.crack-layer{
  position:absolute;

  inset:0;

  pointer-events:none;

  overflow:visible;
}

.crack{
  position:absolute;

  width:150px;
  height:150px;

  opacity:0;

  transform:scale(.4);

  transition:
    opacity 400ms ease,
    transform 500ms cubic-bezier(.2,1.6,.3,1);
}

.crack.visible{
  opacity:1;
  transform:scale(1);
}

.crack svg{
  width:100%;
  height:100%;

  overflow:visible;
}

.crack path{
  fill:none;

  stroke:rgba(230,242,255,.9);

  stroke-width:2;

  stroke-linecap:round;

  filter:
    drop-shadow(
      0 0 5px rgba(155,205,255,.9)
    );
}

.crack:nth-child(1){
  left:8%;
  top:5%;
  transform:rotate(-18deg) scale(.4);
}

.crack:nth-child(2){
  right:5%;
  top:10%;
  transform:rotate(24deg) scale(.4);
}

.crack:nth-child(3){
  left:22%;
  bottom:0;
  transform:rotate(40deg) scale(.4);
}

.crack:nth-child(4){
  right:20%;
  bottom:-5%;
  transform:rotate(-32deg) scale(.4);
}

.crack.visible:nth-child(1){
  transform:rotate(-18deg) scale(1);
}

.crack.visible:nth-child(2){
  transform:rotate(24deg) scale(1);
}

.crack.visible:nth-child(3){
  transform:rotate(40deg) scale(1);
}

.crack.visible:nth-child(4){
  transform:rotate(-32deg) scale(1);
}

/* =========================================================
   TRANSITION
   ========================================================= */

.abyss-transition{
  position:fixed;

  inset:0;

  z-index:999999;

  pointer-events:none;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#000;

  opacity:0;

  animation:
    collapse 2.2s ease-in forwards;
}

.abyss-transition::before{
  content:"";

  position:absolute;

  width:30px;
  height:30px;

  border-radius:50%;

  background:#000;

  box-shadow:
    0 0 25px #000,
    0 0 100px rgba(90,40,170,.75),
    0 0 220px rgba(40,15,100,.85);

  animation:
    hole 2.2s cubic-bezier(.15,.8,.2,1) forwards;
}

.abyss-transition::after{
  content:"";

  position:absolute;

  width:160px;
  height:160px;

  border-radius:50%;

  border:
    2px solid rgba(190,140,255,.75);

  box-shadow:
    0 0 25px rgba(160,100,255,.85),
    0 0 80px rgba(110,50,210,.55);

  animation:
    ring 2.2s ease-in forwards;
}

@keyframes collapse{

  0%{
    opacity:0;
  }

  25%{
    opacity:.85;
  }

  100%{
    opacity:1;
  }
}

@keyframes hole{

  0%{
    width:30px;
    height:30px;
  }

  65%{
    width:130px;
    height:130px;
  }

  100%{
    width:400vmax;
    height:400vmax;
  }
}

@keyframes ring{

  0%{
    transform:
      scale(.4)
      rotate(0);

    opacity:1;
  }

  100%{
    transform:
      scale(18)
      rotate(720deg);

    opacity:0;
  }
}

wipeButton.addEventListener("click", () => {

    "daily bonus, and all other saved Game Hub progress.\n\n" +
    "This cannot be undone."
  );

  if (!confirmed) return;

  /*
   * First attempt to wipe the storage belonging
   * to the actual Game Hub document.
   */
  try {
    localStorage.clear();
  } catch (error) {
    console.error(
      "Game Hub localStorage clear failed:",
      error
    );
  }

  try {
    sessionStorage.clear();
  } catch (error) {
    console.error(
      "Game Hub sessionStorage clear failed:",
      error
    );
  }

  /*
   * Then tell the launcher to perform its
   * own complete reset.
   */
  if (
    window.opener &&
    !window.opener.closed &&
    typeof window.opener.resetGameHubProgress ===
      "function"
  ) {

    window.opener.resetGameHubProgress();

    /*
     * Don't reload the about:blank Game Hub.
     * The launcher will create a fresh one.
     */
    window.close();

  } else {

    alert(
      "The Game Hub launcher could not be reached.\n\n" +
      "Please reopen the Game Hub and try again."
    );
  }

/* =========================================================
   ABOUT:BLANK STARTUP
   ========================================================= */

(function startupAboutBlank(){

  const alreadyAboutBlank =
    window.location.href === "about:blank";

  /*
   * If this is already the cloaked Game Hub,
   * don't run the startup system again.
   */

  if(alreadyAboutBlank){

    initializeGameHub();

    return;
  }


  /*
   * Capture the ENTIRE finished document.
   */

  const completeGameHub =
    "<!DOCTYPE html>\n" +
    document.documentElement.outerHTML;


  /*
   * Store a backup.

   * The about:blank page inherits the opener's origin,
   * so this allows the hub to survive navigation.
   */

  try{

    sessionStorage.setItem(
      "gh_complete_hub",
      completeGameHub
    );

  }catch(error){}


  let newWindow = null;


  try{

    newWindow =
      window.open(
        "about:blank",
        "_blank"
      );

  }catch(error){

    newWindow = null;

  }


  if(newWindow){

    try{

      newWindow.document.open();

      newWindow.document.write(
        completeGameHub
      );

      newWindow.document.close();

      try {

        const favicon =
      
          gameHubWindow.document.createElement("link");
      
        favicon.rel = "icon";
      
        favicon.type = "image/png";
      
        favicon.href =
      
          "data:image/png;base64,PASTE_YOUR_BASE64_HERE";
      
        gameHubWindow.document.head.appendChild(favicon);
      
      } catch (error) {
      
        console.error("Could not set favicon:", error);
      
      }

      newWindow.focus();

    }catch(error){}

  }


  /*
   * White out the original page.
   */

  document.documentElement.innerHTML = `
    <head>

      <title></title>

      <style>

        html,
        body{
          width:100%;
          height:100%;
          min-height:100%;

          margin:0;
          padding:0;

          overflow:hidden;

          background:#fff!important;
        }

      </style>

    </head>

    <body></body>
  `;


  try{
    window.stop();
  }catch(error){}

})();


/* =========================================================
   EVERYTHING BELOW RUNS INSIDE ABOUT:BLANK
   ========================================================= */

function initializeGameHub(){

  /*
   * Prevent accidental double initialization.
   */

  if(window.__GAME_HUB_INITIALIZED__)
    return;

  window.__GAME_HUB_INITIALIZED__ = true;


  /* =======================================================
     ELEMENTS
     ======================================================= */

  const title =
    document.getElementById("titleButton");

  const titleStage =
    document.getElementById("titleStage");

  const crackLayer =
    document.getElementById("crackLayer");

  const abyssPortal =
    document.getElementById("abyssPortal");

  const portalLabel =
    document.getElementById("portalLabel");

  const subtitle =
    document.getElementById("subtitle");

  const hint =
    document.getElementById("hint");

  const grid =
    document.getElementById("gameGrid");

  const toastEl =
    document.getElementById("toast");

  const returnPortalContainer =
    document.getElementById(
      "returnPortalContainer"
    );


  /* =======================================================
     STATE
     ======================================================= */

  let titleClicks = 0;

  let crackCount = 0;

  let abyssUnlocked = false;

  let inAbyss = false;

  let abyssTitleClicks = 0;


  /*
   * IMPORTANT:

   * This persists even after returning from the Abyss.
   */

  try{

    abyssUnlocked =
      localStorage.getItem(
        "gh_abyss_unlocked"
      ) === "1";

  }catch(error){
    abyssUnlocked = false;
  }


  /* =======================================================
     TITLE
     ======================================================= */

  function setTitle(text){

    title.innerHTML = "";

    for(
      let i = 0;
      i < text.length;
      i++
    ){

      const letter =
        document.createElement("span");

      letter.className =
        "title-letter";

      letter.textContent =
        text[i] === " "
          ? "\u00A0"
          : text[i];

      title.appendChild(letter);
    }
  }


  setTitle("The Game Hub");


  /*
   * After the Abyss has been visited,
   * permanently damage the title.
   */

  function damageTitle(){

    setTitle("The Game Hub");

    const letters =
      [...title.querySelectorAll(
        ".title-letter"
      )];

    /*
     * These letters lose most of their glow.
     */

    const deadIndexes = [
      1,
      4,
      7,
      9
    ];

    deadIndexes.forEach(index=>{

      if(letters[index]){
        letters[index]
          .classList
          .add("dead");
      }

    });


    /*
     * Random tiny offsets make the title
     * feel physically damaged.
     */

    letters.forEach((letter,index)=>{

      if(index % 4 === 0){

        letter.style.transform =
          `translateY(${index % 2 ? 2 : -2}px)`;
      }

    });
  }


  /* =======================================================
     TOAST
     ======================================================= */

  function toast(message){

    toastEl.textContent =
      message;

    toastEl.classList.add("show");

    clearTimeout(
      toastEl._timer
    );

    toastEl._timer =
      setTimeout(
        ()=>{
          toastEl.classList.remove("show");
        },
        2600
      );
  }


  /* =======================================================
     PROXY WINDOW
     ======================================================= */

  window.openProxy =
    function(url){

      const win =
        window.open(
          "about:blank",
          "_blank"
        );


      if(!win){

        alert(
          "Pop-up blocked!"
        );

        return;
      }


      /*
       * Escape the URL for the iframe.
       */

      const safeURL =
        String(url)
          .replace(/&/g,"&amp;")
          .replace(/"/g,"&quot;")
          .replace(/</g,"&lt;")
          .replace(/>/g,"&gt;");


      win.document.open();


      win.document.write(`
        <!DOCTYPE html>

        <html>

        <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width,initial-scale=1">

          <title>Game</title>

          <style>

            html,
            body{
              width:100%;
              height:100%;

              margin:0;
              padding:0;

              overflow:hidden;

              background:#000;
            }

            iframe{
              width:100%;
              height:100%;

              border:none;
            }

          </style>

        </head>

        <body>

          <iframe
            src="${safeURL}"
            allowfullscreen>
          </iframe>

        </body>

        </html>
      `);


      win.document.close();

      win.focus();
    };


  /* =======================================================
     GAME BUTTON SYSTEM
     ======================================================= */

  function buttonParticle(
    button,
    x,
    y
  ){

    const particle =
      document.createElement("span");

    particle.className =
      "b-particle";


    particle.style.left =
      `${x}px`;

    particle.style.top =
      `${y}px`;


    const angle =
      Math.random() *
      Math.PI *
      2;

    const distance =
      25 +
      Math.random() *
      70;


    particle.style.setProperty(
      "--px",
      `${Math.cos(angle) * distance}px`
    );

    particle.style.setProperty(
      "--py",
      `${Math.sin(angle) * distance}px`
    );


    particle.style.animationDuration =
      `${500 + Math.random() * 450}ms`;


    button.appendChild(
      particle
    );


    particle.addEventListener(
      "animationend",
      ()=>{
        particle.remove();
      }
    );
  }


  function buttonParticles(
    button,
    x,
    y,
    amount=8
  ){

    for(
      let i=0;
      i<amount;
      i++
    ){

      setTimeout(
        ()=>{
          buttonParticle(
            button,
            x,
            y
          );
        },
        i * 22
      );
    }
  }


  function ripple(
    button,
    x,
    y
  ){

    const ripple =
      document.createElement("span");

    ripple.className =
      "ripple";


    ripple.style.left =
      `${x}px`;

    ripple.style.top =
      `${y}px`;


    button.appendChild(
      ripple
    );


    ripple.addEventListener(
      "animationend",
      ()=>{
        ripple.remove();
      }
    );
  }


  function wireButton(
    button,
    particleCount=16
  ){

    button.addEventListener(
      "pointermove",
      event=>{

        const rect =
          button.getBoundingClientRect();

        const x =
          event.clientX -
          rect.left;

        const y =
          event.clientY -
          rect.top;


        button.style.setProperty(
          "--mx",
          `${x}px`
        );

        button.style.setProperty(
          "--my",
          `${y}px`
        );


        if(
          Math.random() < .16
        ){

          buttonParticle(
            button,
            x,
            y
          );
        }
      }
    );


    button.addEventListener(
      "pointerenter",
      ()=>{

        const rect =
          button.getBoundingClientRect();

        buttonParticles(
          button,
          rect.width / 2,
          rect.height / 2,
          4
        );
      }
    );


    button.addEventListener(
      "pointerdown",
      event=>{

        const rect =
          button.getBoundingClientRect();

        const x =
          event.clientX -
          rect.left;

        const y =
          event.clientY -
          rect.top;


        ripple(
          button,
          x,
          y
        );


        buttonParticles(
          button,
          x,
          y,
          particleCount
        );
      }
    );
  }


  /* =======================================================
     CREATE GAME CARD
     ======================================================= */

  function createGameCard(game){

    const card =
      document.createElement("div");

    card.className =
      "game-card";


    /*
     * Main button:
     * opens the game through about:blank.
     */

    const proxyButton =
      document.createElement("button");

    proxyButton.className =
      "game-button";

    proxyButton.type =
      "button";

    proxyButton.textContent =
      game.name;


    proxyButton.addEventListener(
      "click",
      ()=>{
        openProxy(game.url);
      }
    );


    /*
     * Secondary button:
     * opens the real URL normally.
     */

    const directButton =
      document.createElement("button");

    directButton.className =
      "direct-button";

    directButton.type =
      "button";

    directButton.textContent =
      "OPEN DIRECT";


    directButton.addEventListener(
      "click",
      event=>{

        event.stopPropagation();

        window.open(
          game.url,
          "_blank",
          "noopener"
        );
      }
    );


    card.appendChild(
      proxyButton
    );

    card.appendChild(
      directButton
    );


    wireButton(
      proxyButton,
      16
    );


    return card;
  }


  /* =======================================================
     RENDER GAMES
     ======================================================= */

  function renderGames(games){

    grid.innerHTML = "";


    games.forEach(
      game=>{

        grid.appendChild(
          createGameCard(game)
        );

      }
    );
  }


  /* =======================================================
     TITLE PARTICLES
     ======================================================= */

  function titleParticle(){

    const particle =
      document.createElement("span");

    particle.className =
      "t-particle";


    const angle =
      Math.random() *
      Math.PI *
      2;

    const distance =
      70 +
      Math.random() *
      180;


    particle.style.left =
      "50%";

    particle.style.top =
      "50%";


    particle.style.setProperty(
      "--tx",
      `${Math.cos(angle) * distance}px`
    );

    particle.style.setProperty(
      "--ty",
      `${Math.sin(angle) * distance}px`
    );


    particle.style.animationDuration =
      `${650 + Math.random() * 500}ms`;


    titleStage.appendChild(
      particle
    );


    particle.addEventListener(
      "animationend",
      ()=>{
        particle.remove();
      }
    );
  }


  function burstTitle(
    amount=14
  ){

    for(
      let i=0;
      i<amount;
      i++
    ){

      setTimeout(
        titleParticle,
        i * 12
      );
    }
  }


  /* =======================================================
     CRACK SYSTEM
     ======================================================= */

  function addCrack(){

    if(crackCount >= 4)
      return;


    crackCount++;


    crackLayer
      .querySelectorAll(".crack")
      [crackCount - 1]
      .classList
      .add("visible");


    burstTitle(
      12 + crackCount * 5
    );


    title.style.filter =
      "brightness(1.8)";


    setTimeout(
      ()=>{
        title.style.filter = "";
      },
      180
    );


    if(crackCount === 4){

      setTimeout(
        unlockAbyss,
        700
      );
    }
  }


  /* =======================================================
     FIRST-TIME TITLE SEQUENCE
     ======================================================= */

  title.addEventListener(
    "click",
    ()=>{

      if(inAbyss){

        abyssTitleClicks++;

        burstTitle(10);


        if(
          abyssTitleClicks === 3
        ){

          openVault();

          abyssTitleClicks = 0;
        }


        return;
      }


      /*
       * Once unlocked, clicking the title
       * should not destroy the portal.
       */

      if(abyssUnlocked)
        return;


      titleClicks++;

      burstTitle(
        12 +
        Math.min(
          titleClicks,
          12
        )
      );


      if(
        titleClicks % 3 === 0
      ){

        addCrack();
      }
    }
  );


  /* =======================================================
     UNLOCK ABYSS
     ======================================================= */

  function unlockAbyss(){

    if(abyssUnlocked)
      return;


    abyssUnlocked = true;


    try{

      localStorage.setItem(
        "gh_abyss_unlocked",
        "1"
      );

    }catch(error){}


    titleStage.classList.add(
      "shattered"
    );


    subtitle.textContent =
      "Something is waiting underneath";


    hint.textContent =
      "The way down has opened";


    burstTitle(60);


    setTimeout(
      revealPortal,
      500
    );
  }


  /* =======================================================
     REVEAL PORTAL
     ======================================================= */

  function revealPortal(){

    abyssPortal.classList.add(
      "revealed"
    );

    portalLabel.style.opacity =
      ".65";


    setTimeout(
      ()=>{
        portalLabel.style.opacity =
          "";
      },
      1400
    );
  }


  /* =======================================================
     ENTER ABYSS
     ======================================================= */

  abyssPortal.addEventListener(
    "click",
    event=>{

      event.stopPropagation();

      if(!abyssUnlocked)
        return;


      enterAbyss();
    }
  );


  function enterAbyss(){

    const transition =
      document.createElement("div");

    transition.className =
      "abyss-transition";


    document.body.appendChild(
      transition
    );


    const page =
      document.querySelector(".page");


    page.style.transform =
      "scale(.88)";

    page.style.opacity =
      ".15";

    page.style.filter =
      "blur(8px)";


    setTimeout(
      ()=>{
        buildAbyss();
      },
      1800
    );
  }


  /* =======================================================
     BUILD ABYSS
     ======================================================= */

  function buildAbyss(){

    document
      .querySelector(
        ".abyss-transition"
      )
      ?.remove();


    document.body.classList.add(
      "abyss"
    );


    inAbyss = true;


    const page =
      document.querySelector(".page");


    page.style.transform = "";
    page.style.opacity = "";
    page.style.filter = "";


    titleStage.classList.remove(
      "shattered"
    );


    title.style.animation =
      "none";

    title.style.opacity = "";

    title.style.filter = "";

    title.style.transform = "";


    setTitle(
      "THE ABYSS"
    );


    subtitle.textContent =
      "You probably weren't supposed to find this";


    hint.textContent =
      "There is always another way down";


    /*
     * Hide the entrance portal
     * while actually inside.
     */

    abyssPortal.classList.remove(
      "revealed"
    );


    portalLabel.style.opacity =
      "0";


    /*
     * Abyss games come entirely
     * from ABYSS_GAMES.
     */

    renderGames(
      ABYSS_GAMES
    );


    /*
     * Mystery tile.
     */

    if(mysteryUnlocked){
      addMysteryTile();
    }


    spawnSecretStar();


    /*
     * Create the return portal.
     */

    createReturnPortal();


    page.animate(

      [
        {
          opacity:0,
          transform:"scale(1.12)",
          filter:"blur(12px)"
        },

        {
          opacity:1,
          transform:"scale(1)",
          filter:"blur(0)"
        }
      ],

      {
        duration:1400,
        easing:
          "cubic-bezier(.15,.8,.2,1)"
      }
    );


    toast(
      "You found the Abyss. Look closer."
    );
  }


  /* =======================================================
     RETURN PORTAL
     ======================================================= */

  function createReturnPortal(){

    returnPortalContainer.innerHTML = "";


    const portal =
      document.createElement("div");

    portal.className =
      "return-portal";


    const text =
      document.createElement("span");

    text.className =
      "return-text";

    text.textContent =
      "RETURN TO THE GAME HUB";


    portal.appendChild(
      text
    );


    returnPortalContainer.appendChild(
      portal
    );


    portal.addEventListener(
      "click",
      returnToHub
    );
  }


  /* =======================================================
     RETURN TO NORMAL HUB
     ======================================================= */

  function returnToHub(){

    inAbyss = false;

    abyssTitleClicks = 0;


    document.body.classList.remove(
      "abyss"
    );


    /*
     * Rebuild normal title.
     */

    setTitle(
      "The Game Hub"
    );


    /*
     * This is the important visual:
     *
     * the title is now permanently damaged.
     */

    damageTitle();


    subtitle.textContent =
      "Something came back with you";


    hint.textContent =
      "The Abyss remains open";


    /*
     * Restore normal games.
     */

    renderGames(
      REGULAR_GAMES
    );


    /*
     * Keep the Abyss portal visible.
     */

    abyssPortal.classList.add(
      "revealed"
    );


    portalLabel.style.opacity =
      "";


    /*
     * Remove return portal.
     */

    returnPortalContainer.innerHTML =
      "";


    /*
     * Dramatic return animation.
     */

    const page =
      document.querySelector(".page");


    page.animate(

      [
        {
          opacity:0,
          transform:
            "scale(.94) translateY(15px)",
          filter:"blur(10px)"
        },

        {
          opacity:1,
          transform:
            "scale(1) translateY(0)",
          filter:"blur(0)"
        }
      ],

      {
        duration:1100,
        easing:
          "cubic-bezier(.15,.8,.2,1)"
      }
    );


    burstTitle(35);


    toast(
      "You returned. The door did not close."
    );
  }


  /* =======================================================
     SECRET STAR
     ======================================================= */

  function spawnSecretStar(){

    const star =
      document.createElement(
        "button"
      );


    star.className =
      "secret-star";

    star.type =
      "button";

    star.setAttribute(
      "aria-label",
      "???"
    );


    const top =
      8 +
      Math.random() * 10;

    const left =
      6 +
      Math.random() * 88;


    star.style.top =
      `${top}%`;

    star.style.left =
      `${left}%`;


    document
      .querySelector(".hero")
      .appendChild(
        star
      );


    star.addEventListener(
      "click",
      event=>{

        event.stopPropagation();

        addShards(5);

        toast(
          "A faint echo answers. +5 Shards."
        );


        star.remove();


        setTimeout(
          spawnSecretStar,
          20000 +
          Math.random() * 20000
        );
      }
    );
  }


  /* =======================================================
     SHARDS
     ======================================================= */

  function getShards(){

    try{

      return parseInt(
        localStorage.getItem(
          "gh_shards"
        ) || "0",
        10
      );

    }catch(error){

      return 0;
    }
  }


  function setShards(value){

    try{

      localStorage.setItem(
        "gh_shards",
        String(value)
      );

    }catch(error){}
  }


  function addShards(amount){

    const before =
      getShards();

    const now =
      before + amount;


    setShards(now);


    const element =
      document.getElementById(
        "shardCount"
      );


    if(element){

      element.textContent =
        now;
    }


    if(
      before < 100 &&
      now >= 100
    ){

      toast(
        "100 Shards. The Abyss hums with approval."
      );


      document.documentElement
        .style
        .setProperty(
          "--glow",
          "rgba(255,210,120,.55)"
        );
    }
  }


  function lastBonusDate(){

    try{

      return localStorage.getItem(
        "gh_bonus_date"
      );

    }catch(error){

      return null;
    }
  }


  function setBonusDate(date){

    try{

      localStorage.setItem(
        "gh_bonus_date",
        date
      );

    }catch(error){}
  }


  /* =======================================================
     VAULT
     ======================================================= */

  function todayStr(){

    return new Date()
      .toISOString()
      .slice(0,10);
  }


  function refreshVault(){

    const button =
      document.getElementById(
        "bonusBtn"
      );


    if(!button)
      return;


    if(
      lastBonusDate() ===
      todayStr()
    ){

      button.disabled = true;

      button.textContent =
        "Come back tomorrow";

    }else{

      button.disabled = false;

      button.textContent =
        "Claim daily bonus";
    }
  }


  function openVault(){

    let vault =
      document.getElementById(
        "vaultPanel"
      );


    if(vault){

      vault.classList.add(
        "open"
      );

      refreshVault();

      return;
    }


    vault =
      document.createElement(
        "section"
      );


    vault.id =
      "vaultPanel";

    vault.className =
      "vault open";


    vault.innerHTML = `

      <div>

        <h3>
          The Vault
        </h3>

        <p>
          You have
          <span
            class="shard-count"
            id="shardCount">
            ${getShards()}
          </span>
          Shards.
          One bonus per day.
        </p>

      </div>

      <button
        class="vault-btn"
        id="bonusBtn"
        type="button">
        Claim daily bonus
      </button>

    `;


    document
      .querySelector("main.page")
      .appendChild(vault);


    document
      .getElementById("bonusBtn")
      .addEventListener(
        "click",
        claimBonus
      );


    refreshVault();


    toast(
      "The Vault opens."
    );
  }


  function claimBonus(){

    if(
      lastBonusDate() ===
      todayStr()
    ){

      return;
    }


    const reward =
      10 +
      Math.floor(
        Math.random() * 41
      );


    addShards(
      reward
    );


    setBonusDate(
      todayStr()
    );


    toast(
      `Daily bonus claimed: +${reward} Shards`
    );


    refreshVault();
  }


  /* =======================================================
     MYSTERY TILE
     ======================================================= */

  let typed = [];

  let arrowSeq = [];

  let mysteryUnlocked = false;


  try{

    mysteryUnlocked =
      localStorage.getItem(
        "gh_mystery"
      ) === "1";

  }catch(error){}


  const KONAMI = [

    "ArrowUp",
    "ArrowUp",
    "ArrowDown",
    "ArrowDown",
    "ArrowLeft",
    "ArrowRight",
    "ArrowLeft",
    "ArrowRight"

  ];


  function addMysteryTile(){

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "game-card";


    const button =
      document.createElement(
        "button"
      );

    button.className =
      "game-button";

    button.type =
      "button";

    button.textContent =
      "???";


    button.addEventListener(
      "click",
      ()=>{
        openProxy(
          "https://www.crazygames.com/game/slope"
        );
      }
    );


    card.appendChild(
      button
    );


    const direct =
      document.createElement(
        "button"
      );

    direct.className =
      "direct-button";

    direct.type =
      "button";

    direct.textContent =
      "OPEN DIRECT";


    direct.addEventListener(
      "click",
      ()=>{
        window.open(
          "https://www.crazygames.com/game/slope",
          "_blank",
          "noopener"
        );
      }
    );


    card.appendChild(
      direct
    );


    grid.appendChild(
      card
    );


    wireButton(
      button,
      12
    );
  }


  function unlockMysteryTile(){

    if(mysteryUnlocked)
      return;


    mysteryUnlocked = true;


    try{

      localStorage.setItem(
        "gh_mystery",
        "1"
      );

    }catch(error){}


    addShards(25);

    addMysteryTile();


    toast(
      "The old code still works. +25 Shards. A door unlocks."
    );
  }


  /* =======================================================
     KEYBOARD SECRETS
     ======================================================= */

  document.addEventListener(
    "keydown",
    event=>{

      if(!inAbyss)
        return;


      typed.push(
        event.key
      );


      typed =
        typed
          .join("")
          .slice(-6)
          .split("");


      if(
        typed.join("")
          .toLowerCase()
          .endsWith("shard")
      ){

        addShards(15);

        toast(
          "A whisper rewards curiosity. +15 Shards."
        );


        typed = [];
      }


      if(
        event.key.startsWith(
          "Arrow"
        )
      ){

        arrowSeq.push(
          event.key
        );


        arrowSeq =
          arrowSeq.slice(
            -KONAMI.length
          );


        if(
          arrowSeq.join() ===
          KONAMI.join()
        ){

          unlockMysteryTile();
        }
      }
    }
  );


  /* =======================================================
     LONG-PRESS SECRET
     ======================================================= */

  let echoUnlocked = false;

  let pressTimer = null;


  try{

    echoUnlocked =
      localStorage.getItem(
        "gh_echo"
      ) === "1";

  }catch(error){}


  subtitle.addEventListener(
    "pointerdown",
    ()=>{

      if(
        !inAbyss ||
        echoUnlocked
      ){

        return;
      }


      pressTimer =
        setTimeout(
          ()=>{

            echoUnlocked = true;


            try{

              localStorage.setItem(
                "gh_echo",
                "1"
              );

            }catch(error){}


            addShards(20);


            toast(
              "You listened long enough. +20 Shards."
            );

          },
          1400
        );
    }
  );


  [
    "pointerup",
    "pointerleave",
    "pointercancel"
  ].forEach(
    eventName=>{

      subtitle.addEventListener(
        eventName,
        ()=>{

          clearTimeout(
            pressTimer
          );

        }
      );
    }
  );


  /* =======================================================
     INITIAL STATE
     ======================================================= */

  renderGames(
    REGULAR_GAMES
  );


  /*
   * If the player has EVER entered
   * the Abyss before, immediately reveal
   * the damaged portal.
   */

  if(abyssUnlocked){

    damageTitle();

    subtitle.textContent =
      "Something came back with you";

    hint.textContent =
      "The Abyss remains open";

    revealPortal();

  }


  /*
   * Otherwise use the original
   * discovery sequence.
   */

}


/* =========================================================
   START
   ========================================================= */

if(
  window.location.href ===
  "about:blank"
){

  initializeGameHub();

}

</script>

</body>
</html>
